# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/promotion/webserver.pid;
error_log /var/log/sdkwork/promotion/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name promotion-test.sdkwork.com promotion-test.birdcoder.com promotion-test.dtupay.com promotion-test.sdkwork.cn promotion-test.birdcoder.cn promotion-test.dtupay.cn promotion-test.skubc.com promotion-test.skubc.cn promotion-test.zowalk.com promotion-test.zowalk.cn promotion-test.offer86.com promotion-test.offer86.cn promotion-test.86offer.com promotion-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
