# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/promotion/webserver.pid;
error_log /var/log/sdkwork/promotion/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name promotion-demo.sdkwork.com promotion-demo.birdcoder.com promotion-demo.dtupay.com promotion-demo.noaper.com promotion-demo.sdkwork.cn promotion-demo.birdcoder.cn promotion-demo.dtupay.cn promotion-demo.noaper.cn promotion-demo.skubc.com promotion-demo.skubc.cn promotion-demo.zowalk.com promotion-demo.zowalk.cn promotion-demo.offer86.com promotion-demo.offer86.cn promotion-demo.86offer.com promotion-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/promotion/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
