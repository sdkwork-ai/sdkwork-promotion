# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/promotion/webserver.pid;
error_log /var/log/sdkwork/promotion/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name promotion-staging.sdkwork.com promotion-staging.birdcoder.com promotion-staging.dtupay.com promotion-staging.sdkwork.cn promotion-staging.birdcoder.cn promotion-staging.dtupay.cn promotion-staging.skubc.com promotion-staging.skubc.cn promotion-staging.zowalk.com promotion-staging.zowalk.cn promotion-staging.offer86.com promotion-staging.offer86.cn promotion-staging.86offer.com promotion-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
